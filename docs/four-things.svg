<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img">
  <rect x="0" y="0" width="1000" height="300" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="24" y="38" font-size="21" font-weight="700" fill="#1B2A4A">Four things a senior product manager rarely has together</text>
    <text x="24" y="62" font-size="14" fill="#5B6169">Most senior PMs have one or two of these. I have all four.</text>

    <rect x="24" y="86" width="223" height="190" rx="8" fill="#F5F6F7" stroke="#B9BEC6"/>
    <rect x="24" y="86" width="223" height="34" rx="8" fill="#E6F4F1"/>
    <rect x="24" y="110" width="223" height="10" fill="#E6F4F1"/>
    <text x="40" y="108" font-size="11.5" font-weight="700" fill="#0B6E5F" letter-spacing="0.6">CONSUMER AI, AT SCALE</text>
    <text x="40" y="164" font-size="30" font-weight="700" fill="#1B2A4A">250M+</text>
    <text x="40" y="192" font-size="12.5" fill="#5B6169">phones shipped with Glance AI</text>
    <text x="40" y="210" font-size="12.5" fill="#5B6169">Lock Screen on them, across</text>
    <text x="40" y="228" font-size="12.5" fill="#5B6169">8 markets.</text>
    <text x="40" y="258" font-size="11.5" fill="#8A8F98">InMobi 2022-26, Group PM Jan 2023</text>

    <rect x="268" y="86" width="223" height="190" rx="8" fill="#F5F6F7" stroke="#B9BEC6"/>
    <rect x="268" y="86" width="223" height="34" rx="8" fill="#E6F4F1"/>
    <rect x="268" y="110" width="223" height="10" fill="#E6F4F1"/>
    <text x="284" y="108" font-size="11.5" font-weight="700" fill="#0B6E5F" letter-spacing="0.6">MONEY THROUGH MY PRODUCT</text>
    <text x="284" y="164" font-size="30" font-weight="700" fill="#1B2A4A">50 Cr a month</text>
    <text x="284" y="192" font-size="12.5" fill="#5B6169">of rent at peak, through a</text>
    <text x="284" y="210" font-size="12.5" fill="#5B6169">product I started as a 1 crore</text>
    <text x="284" y="228" font-size="12.5" fill="#5B6169">pilot. Cr is crore, 10M rupees.</text>
    <text x="284" y="258" font-size="11.5" fill="#8A8F98">Magicbricks Pay Rent</text>

    <rect x="512" y="86" width="223" height="190" rx="8" fill="#F5F6F7" stroke="#B9BEC6"/>
    <rect x="512" y="86" width="223" height="34" rx="8" fill="#E6F4F1"/>
    <rect x="512" y="110" width="223" height="10" fill="#E6F4F1"/>
    <text x="528" y="108" font-size="11.5" font-weight="700" fill="#0B6E5F" letter-spacing="0.6">SHIPPING ON THEIR PHONES</text>
    <text x="528" y="158" font-size="19" font-weight="700" fill="#1B2A4A">Samsung. Verizon.</text>
    <text x="528" y="180" font-size="19" font-weight="700" fill="#1B2A4A">SoftBank.</text>
    <text x="528" y="204" font-size="12.5" fill="#5B6169">Once the deal is signed, someone</text>
    <text x="528" y="222" font-size="12.5" fill="#5B6169">has to make it work on their</text>
    <text x="528" y="240" font-size="12.5" fill="#5B6169">phones. That was my job.</text>
    <text x="528" y="258" font-size="11.5" fill="#8A8F98">Phone makers and phone networks</text>

    <rect x="756" y="86" width="220" height="190" rx="8" fill="#FDF6F5" stroke="#E8D5D2"/>
    <rect x="756" y="86" width="220" height="34" rx="8" fill="#D97757"/>
    <rect x="756" y="110" width="220" height="10" fill="#D97757"/>
    <text x="772" y="108" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.6">I BUILD PRODUCTS MYSELF</text>
    <text x="772" y="164" font-size="30" font-weight="700" fill="#5C4A47">4 of my own.</text>
    <text x="772" y="192" font-size="12.5" fill="#5C4A47">Three live AI products and one</text>
    <text x="772" y="210" font-size="12.5" fill="#5C4A47">public product exercise, built</text>
    <text x="772" y="228" font-size="12.5" fill="#5C4A47">with AI assistants typing.</text>
    <text x="772" y="258" font-size="11.5" fill="#8A8F98">Everything below is mine</text>
  </g>
</svg>
